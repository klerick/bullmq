name: Go Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: go-test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.filter.outputs.go }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            go:
              - 'go/**'
              - 'src/commands/**'
              - '.github/workflows/go-test.yml'

  test:
    needs: changes
    if: needs.changes.outputs.should_run == 'true'
    name: Go Tests
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      REDIS_ADDR: 127.0.0.1:6379

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: lts/*
          cache: 'yarn'

      # The Go port embeds the include-resolved Lua from rawScripts. Unlike rust/
      # python (which package these at publish time), Go serves modules straight from
      # the git tag, so go/commands/*.lua MUST be committed. Regenerate here and fail
      # if the committed copy is stale — i.e. someone changed src/commands without
      # running `yarn generate:raw:scripts && yarn copy:lua:go` and committing.
      - name: Verify committed go/commands is up to date
        run: |
          yarn install --frozen-lockfile --non-interactive
          yarn generate:raw:scripts
          yarn copy:lua:go
          if ! git diff --exit-code -- go/commands; then
            echo "::error::go/commands is stale. Run 'yarn generate:raw:scripts && yarn copy:lua:go' and commit."
            exit 1
          fi

      - name: Install Go toolchain
        uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum

      - name: Check formatting
        run: test -z "$(gofmt -l go/)" || (gofmt -l go/ && exit 1)

      - name: Vet
        working-directory: go
        run: go vet ./...

      - name: Build
        working-directory: go
        run: go build ./...

      # Node bullmq pinned to the rawScripts version, for cross-runtime interop tests.
      - name: Install interop harness deps
        working-directory: go/interop
        run: npm install --no-audit --no-fund

      - name: Test (with race detector)
        working-directory: go
        run: go test -race ./...
